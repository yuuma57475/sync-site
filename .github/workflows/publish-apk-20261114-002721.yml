name: Publish verified Sync APK
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-apk-20261114-002721.yml"]
permissions:
  contents: write
concurrency:
  group: sync-verified-apk-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify APK and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CONFIG: 
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request, urllib.parse
          cfg = json.loads(base64.b64decode(os.environ['RELEASE_CONFIG']))
          source = 'https://desktop-a104f6h.tail975315.ts.net/api/app/update/'
          with urllib.request.urlopen(source + 'info', timeout=60) as response:
              manifest = json.load(response)
          assert manifest['apkVersion'] == cfg['version'], 'Update server changed; do not publish a different build'
          path = pathlib.Path('Sync.apk')
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(source + 'download', timeout=60) as response, path.open('wb') as output:
              while chunk := response.read(1024 * 1024):
                  size += len(chunk)
                  assert size <= cfg['size'], 'Unexpected APK length'
                  digest.update(chunk)
                  output.write(chunk)
          assert size == cfg['size'] and digest.hexdigest() == cfg['sha256'], 'APK hash mismatch'
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'yuuma57475/sync-site'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'}
          def api(url, method='GET', value=None, binary=False):
              assert urllib.parse.urlsplit(url).hostname in ('api.github.com', 'uploads.github.com')
              data = value if binary else json.dumps(value).encode() if value is not None else None
              request = urllib.request.Request(url, data=data, method=method, headers={**headers,
                  'Content-Type': 'application/vnd.android.package-archive' if binary else 'application/json'})
              with urllib.request.urlopen(request, timeout=300) as response:
                  return json.load(response)
          # Read all matching releases, including an interrupted draft, before creating.
          releases = api(base + '/releases?per_page=100')
          release = next((r for r in releases if r['tag_name'] == cfg['tag']), None)
          if release is None:
              release = api(base + '/releases', 'POST', {'tag_name': cfg['tag'],
                  'target_commitish': os.environ['GITHUB_SHA'], 'name': 'Sync Android ' + cfg['version'],
                  'body': cfg['body'], 'draft': True, 'prerelease': False})
          asset = next((a for a in release['assets'] if a['name'] == 'Sync.apk'), None)
          if asset is None:
              assert release['draft'], 'Never replace a published asset'
              upload = release['upload_url'].split('{', 1)[0] + '?name=Sync.apk'
              asset = api(upload, 'POST', path.read_bytes(), binary=True)
          assert asset['size'] == cfg['size'] and asset['state'] == 'uploaded'
          if asset.get('digest'):
              assert asset['digest'] == 'sha256:' + cfg['sha256']
          if release['draft']:
              release = api(release['url'], 'PATCH', {'draft': False, 'make_latest': 'true'})
          print('Published verified APK:', release['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Published [' + cfg['version'] + '](' + release['html_url'] + ')\n\nSHA-256: `' + cfg['sha256'] + '`\n')
